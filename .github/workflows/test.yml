name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No TeX on these runners: the build test skips itself.
      - run: node --test

  compile:
    name: Build with TeX Live (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-binaries latexmk
      - run: node --test

  manifest:
    name: Manifest and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The manifest parses, and a release tag matches its version
        run: |
          node -e "
            const manifest = JSON.parse(require('fs').readFileSync('orca-plugin.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME;
            if (process.env.GITHUB_REF_TYPE === 'tag' && tag !== 'v' + manifest.version) {
              console.error('Tag ' + tag + ' does not match version ' + manifest.version);
              process.exit(1);
            }
            console.log(manifest.id + ' ' + manifest.version);
          "
      - name: No binary files outside the images
        run: |
          bad=$(git ls-files | grep -v '^images/' | while read -r f; do grep -Iq . "$f" || echo "$f"; done)
          if [ -n "$bad" ]; then echo "Binary files: $bad"; exit 1; fi
